name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Every commit needs a Signed-off-by line (DCO)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..${{ github.sha }}"
            fi
          fi
          fail=0
          for sha in $(git rev-list "$RANGE"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .*<.*@.*>'; then
              echo "::error file=::Commit $sha has no Signed-off-by line — redo with 'git commit -s'"
              fail=1
            fi
          done
          exit $fail

  tests:
    name: tests (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:10
          coverage: none
      - name: Lint all PHP sources
        shell: bash
        run: |
          set -euo pipefail
          find lib appinfo tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "lint ok"
      - name: PHPUnit
        run: phpunit --do-not-cache-result
