<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#7fbf7f"/>
  <!-- Ordner-Silhouette mit direkt integriertem Reiter (10px Buckel) -->
  <path d="M 22 112
           A 8 8 0 0 1 14 104
           L 14 26
           A 8 8 0 0 1 22 18
           L 45 18
           C 49 18 51 20 54 23
           L 56 25
           C 58 27 60 28 64 28
           L 106 28
           A 8 8 0 0 1 114 36
           L 114 104
           A 8 8 0 0 1 106 112
           Z" fill="#ffffff"/>
  <!-- Negativraum-Luecke um das Dokument (4px Abstand) -->
  <rect x="30" y="32" width="68" height="70" rx="10" fill="#7fbf7f"/>
  <!-- Dokument-Blatt im Vordergrund -->
  <rect x="34" y="36" width="60" height="62" rx="7" fill="#ffffff"/>
  <!-- Textzeile 1 -->
  <rect x="42" y="45" width="44" height="5.5" rx="2.75" fill="#7fbf7f"/>
  <!-- Textzeile 2: Umrandeter Highlight-Balken (Suchtreffer hervorgehoben) -->
  <rect x="40" y="55" width="48" height="13" rx="4" fill="#7fbf7f"/>
  <rect x="44" y="58.5" width="40" height="6" rx="3" fill="#ffffff"/>
  <!-- Textzeile 3 -->
  <rect x="42" y="73" width="34" height="5.5" rx="2.75" fill="#7fbf7f"/>
  <!-- Textzeile 4 -->
  <rect x="42" y="83" width="22" height="5.5" rx="2.75" fill="#7fbf7f"/>
  <!-- Lupe: Negativraum-Halo (gruene Konturtrennung zum Hintergrund) -->
  <line x1="87.71" y1="85.71" x2="104.89" y2="102.89" stroke="#7fbf7f" stroke-width="9.90" stroke-linecap="round"/>
  <circle cx="80.00" cy="78.00" r="16.20" fill="#7fbf7f"/>
  <!-- Lupe: Griff (schlankes Staebchen im 45-Grad-Winkel nach unten rechts) -->
  <line x1="87.71" y1="85.71" x2="102.63" y2="100.63" stroke="#ffffff" stroke-width="3.50" stroke-linecap="round"/>
  <!-- Lupe: Ring (schlanker Aussenring) -->
  <circle cx="80.00" cy="78.00" r="13.00" fill="#ffffff"/>
  <!-- Lupe: Linse (gruener durchscheinender Negativraum) -->
  <circle cx="80.00" cy="78.00" r="8.80" fill="#7fbf7f"/>
  <!-- Lupe: Glas-Reflexion (bogenfoermiges Glanzlicht, zerstoert Q-Wirkung) -->
  <path d="M 73.61 75.67 A 6.80 6.80 0 0 1 77.67 71.61" stroke="#ffffff" stroke-width="2.00" stroke-linecap="round" fill="none"/>
</svg>
